# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo in Render → New → Blueprint → apply this file.

services:
  - type: web
    name: publication-assistant-api
    runtime: python
    region: frankfurt # change if you prefer oregon / singapore / etc.
    plan: starter # free tier available; upgrade if cold starts are an issue
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: HISTORY_BACKEND
        value: memory
      # Required — set in Render dashboard (secret) or sync from secret store
      - key: GROQ_API_KEY
        sync: false
      # Your Vercel URL(s), comma-separated — e.g. https://app.vercel.app,https://*.vercel.app not supported; list each preview host or use only production URL
      - key: FRONTEND_ORIGIN
        sync: false
      # Optional overrides
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MAX_LLM_INPUT_CHARS
        value: "24000"
